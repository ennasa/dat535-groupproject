# Shared settings. dev/prod/test.yaml override only what differs.
# Never put secrets here - they come from environment variables / GitHub secrets.

project:
  name: dat535-pipeline

storage:
  root: ./data            # overridden per environment
  bronze: bronze
  silver: silver
  gold: gold
  quarantine: quarantine
  manifests: manifests

source:
  name: fiskeridir_catch
  periods: []             # Annual catch years, e.g. ["2023"]
  url_template: https://register.fiskeridir.no/uttrekk/fangstdata_{period}.csv.zip
  timeout_seconds: 120

spark:
  app_name: dat535-pipeline
  master: local[*]
  conf:
    spark.sql.adaptive.enabled: "true"
    spark.sql.shuffle.partitions: "8"
    spark.sql.session.timeZone: UTC

quality:
  max_reject_ratio: 0.05  # fail the run if more than 5% of records are rejected
  rules: {}               # filled in during Silver (#17)
  allow_unvalidated_silver: false

silver:
  allow_provisional_model: false
  approved_source_versions: {}
  dedup_strategy: optimized

gold:
  allow_unvalidated_silver: false

run:
  layers: [bronze, silver, gold]
  stop_on_quality_failure: true

logging:
  level: INFO
