name: Run pipeline

# Manual only until the self-hosted runners exist (#6).
# Uncomment the schedule when the prod runner is registered (#33).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
  # schedule:
  #   - cron: "17 3 * * *"   # daily 03:17 UTC

concurrency:
  group: pipeline-vm
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, "${{ inputs.environment || 'prod' }}"]
    env:
      PIPELINE_ENV: ${{ inputs.environment || 'prod' }}
      PIPELINE_STORAGE_ROOT: /home/ubuntu/dat535/${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          /home/ubuntu/spark-env/bin/python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Bronze -> Silver -> Gold
        run: .venv/bin/python src/main.py --run-id "${{ github.run_id }}"
